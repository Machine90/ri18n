[package]
name = "ri18n"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = { version = "1.0" }
regex = "1.11"
toml = "0.9"
yaml-rust2 = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
whatlang = "0.16"
hashlink = { version = "0.10" }
java-properties = "2.0"
convert_case = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
enum-kinds = "0.5"

[dev-dependencies]
rstest = "0.25"
tempfile = "3"
test-log = { version = "0.2", features = ["trace"] }